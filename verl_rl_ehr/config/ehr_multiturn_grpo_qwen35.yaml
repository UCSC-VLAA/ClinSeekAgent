# Multi-turn GRPO recipe for Qwen3.5-35B-A3B on EHR-Bench.
# Inherits verl's ppo_trainer base, overriding adv_estimator to GRPO and
# wiring multi-turn tool-calling + context-reset + custom reward.
#
# Paths assume the repo layout at /fsx-shared/juncheng/EHR.
# Launch via `python -m verl.trainer.main_ppo --config-path ... --config-name ehr_multiturn_grpo_qwen35`

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

# ── Data ─────────────────────────────────────────────────────────────────
data:
  train_files: /fsx-shared/juncheng/EHR/data/ehr_rl_qwen35/train.parquet
  val_files: /fsx-shared/juncheng/EHR/data/ehr_rl_qwen35/val.parquet
  max_prompt_length: 4096
  # Bumped from 12288 to 20480 to give long-answer tasks (labevents, prescriptions,
  # microbiologyevents) enough response-token budget to reach the forced-answer
  # prefix + emit a full <answer>[…]</answer> block. At 12288 we observed ~90% of
  # labevents rollouts saturating the cap before submitting, collapsing training.
  max_response_length: 20480
  train_batch_size: 16
  filter_overlong_prompts: True
  truncation: error
  return_raw_chat: True
  # `enable_thinking` left at default (True) — we're training from the base
  # Qwen3.5-35B-A3B weights (not the SFT'd checkpoint), and the base model
  # closes `<think>` blocks correctly. The qwen3_coder parser strips tool
  # calls out of the assistant text before parsing, so think content and
  # tool calls coexist cleanly.
  apply_chat_template_kwargs: {}

# ── Reward ───────────────────────────────────────────────────────────────
custom_reward_function:
  path: /fsx-shared/juncheng/EHR/verl_rl_ehr/reward/ehr_reward.py
  name: compute_score

# ── Algorithm: GRPO ──────────────────────────────────────────────────────
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  gamma: 1.0
  lam: 1.0
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

# ── Actor / Rollout / Reference ──────────────────────────────────────────
actor_rollout_ref:
  hybrid_engine: true

  model:
    # HF-converted SFT checkpoint — populated by scripts/convert_sft_ckpt_to_hf.sh.
    path: /fsx-shared/juncheng/EHR/checkpoints/qwen3_5_35b_a3b_sft_hf
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true

  actor:
    optim:
      lr: 1.0e-6
      clip_grad: 0.5
      weight_decay: 0.01
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    clip_ratio: 0.2
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      model_dtype: bf16

  ref:
    log_prob_micro_batch_size_per_gpu: 2
    fsdp_config:
      param_offload: false

  rollout:
    # sglang rollout — matches OpenResearcher researcher_v2's verified Qwen3.5-35B
    # recipe (docs/04092026_4node_rl_environment.md). sglang 0.5.9 + sgl_kernel
    # 0.3.21 + flashinfer 0.6.3 + flash-attn 2.8.3 against torch 2.9.0+cu128.
    name: sglang
    mode: async
    temperature: 1.0
    top_p: 0.95
    tensor_model_parallel_size: 4
    gpu_memory_utilization: 0.6
    # Bumped alongside max_response_length=20480. max_model_len is what sglang
    # sees per generate call — stays larger than context_reset_threshold so
    # the reset path has headroom before vLLM hits its own cap.
    max_model_len: 24576
    max_num_seqs: 128
    n: 8
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 4

    multi_turn:
      enable: true
      # Qwen3.5 SFT emits the Qwen3-XML tool-call format:
      #   <tool_call><function=name><parameter=k>v</parameter></function></tool_call>
      # not the Hermes JSON-in-XML. Parser mismatch was silently dropping every
      # tool call (verl's HermesToolParser returned [] → agent loop went to
      # INTERACTING instead of PROCESSING_TOOLS → tool response never reached
      # the trajectory). `qwen3_coder` is verl's registered name for the
      # Qwen3XMLToolParser (sglang calls the same wire format `qwen3_xml`).
      format: qwen3_coder
      max_assistant_turns: 18
      max_user_turns: 18
      max_parallel_calls: 1
      max_tool_response_length: 2048
      tool_response_truncate_side: middle
      tool_config_path: /fsx-shared/juncheng/EHR/verl_rl_ehr/config/tool_config/ehr_tool_config.yaml
      interaction_config_path: /fsx-shared/juncheng/EHR/verl_rl_ehr/config/interaction_config/ehr_interaction_config.yaml
      # Context management — naive sliding-window reset.
      # When generation_prompt >= context_reset_threshold tokens, rebuild it
      # as [system, original_user, *messages[-keep_last_rounds*2:]] dropping
      # the middle. Up to context_reset_max_count resets per rollout; the
      # (N+1)th overflow falls through to _maybe_force_answer.
      # Threshold ≈ max_model_len − 2K headroom; setting to 0 disables.
      context_reset_enabled: true
      context_reset_threshold: 14000
      # "summarizer" (default, v5h-style, best submission rate) or
      # "sliding_window" (v5m — keep last N rounds verbatim).
      context_reset_mode: summarizer
      context_reset_keep_last_rounds: 4
      context_reset_max_count: 10
      # Soft token cap: when response_mask crosses this length, force-inject
      # an ehr.finish tool-call prefix so remaining tokens go toward the
      # answer rather than more exploration. 0 disables (force-answer only
      # fires at response_length exhaustion). For v5o: 52000 leaves 4K
      # headroom inside max_response_length=56000 for the forced emission.
      force_answer_token_threshold: 0
      context_reset_message: "[Context was reset to manage length. The original question is above. Continue your research — you may search again or submit your answer.]"
      # Optional Claude Haiku summarizer via Bedrock. Off by default. When on,
      # hitting the threshold triggers a summary call that replaces the static
      # reset note with bullet-point findings. Falls back to static on failure.
      context_reset_summarizer_enabled: false
      context_reset_summarizer_model: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
      context_reset_summarizer_region: "us-east-1"
      context_reset_summarizer_max_tokens: 1024
      context_reset_summarizer_aws_key: null
      context_reset_summarizer_aws_secret: null
      # Force-finish-tool fallback. When true, the last-resort
      # answer-injection path emits a Qwen3-XML ehr.finish tool-call prefix
      # (matching the SFT emission format and the canonical submission
      # path) instead of the default <answer> text prefix. Enabled in v8
      # because the parser-mismatch bug is fixed and ehr.finish is now a
      # real routable path — unifies training signal around one submission
      # mechanism. SFT-ed Qwen3.5 was trained with `response` as the tool
      # argument name, not `answer`.
      force_finish_tool_enabled: true
      force_finish_tool_name: "ehr.finish"
      force_finish_tool_param: "response"

    agent:
      default_agent_loop: tool_agent

    val_kwargs:
      n: 1
      temperature: 0.0
      do_sample: false

    engine_kwargs:
      sglang:
        # Qwen3.5 native tool-call XML; sglang's hermes parser reads the same
        # wire format that our SFT emits. Explicit registration avoids
        # fallback-to-JSON guessing in sglang.
        tool_call_parser: qwen3_xml

    server:
      timeout: 180
      max_attempts: 3
      retry_delay: 5
      max_connections: 500
      max_start_wait_time: 900.0

# ── Trainer ──────────────────────────────────────────────────────────────
trainer:
  project_name: deepmed-rl
  experiment_name: ehr_grpo_qwen35_v0
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: 2
  save_freq: 10
  test_freq: 10
  val_before_train: true
  resume_mode: auto
  default_local_dir: /fsx-shared/juncheng/EHR/checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: 3
  logger: ["console", "wandb"]
